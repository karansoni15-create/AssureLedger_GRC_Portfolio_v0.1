name: assurance-tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Unit tests (includes the committed-report reproducibility check)
        run: python -m unittest discover -s tests -v
      - name: Generate reports from the installed package
        run: assureledger --as-of 2026-10-10 --out build-report
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: assurance-reports
          path: build-report/
